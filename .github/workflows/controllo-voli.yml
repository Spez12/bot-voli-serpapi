name: Controllo Prezzi Voli

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  controllo-voli:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Avvia controllo voli
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ORIGINS: ${{ vars.ORIGINS }}
          DESTINATIONS: ${{ vars.DESTINATIONS }}
          DEPARTURE_DATE: ${{ vars.DEPARTURE_DATE }}
          RETURN_DATE: ${{ vars.RETURN_DATE }}
          TRIP_PERIODS: ${{ vars.TRIP_PERIODS }}
          ADULTS: ${{ vars.ADULTS }}
          CURRENCY: ${{ vars.CURRENCY }}
          MAX_PRICE: ${{ vars.MAX_PRICE }}
        run: |
          echo "## Risultati controllo voli" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python bot_voli_multi.py | tee risultato.txt
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat risultato.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Salva iscritti aggiornati
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add subscribers.json telegram_offset.txt
          git commit -m "Aggiorna iscritti Telegram" || echo "Nessuna modifica da salvare"
          git push
